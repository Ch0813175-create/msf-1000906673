name: Android Build & Assemble Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble Official Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Assemble Release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assemble --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assemble --stacktrace
          fi

      - name: Upload Assembled Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn